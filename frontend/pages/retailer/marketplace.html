<!-- Browse farmer products -->


<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace | AgriRetail</title>
  <link rel="stylesheet" href="../../css/retailer.css">
  <script src="../../js/i18n.js"></script>
  <script src="../../js/shell.js"></script>
</head>

<body data-page="marketplace">
  <script>
    document.body.insertAdjacentHTML("afterbegin", dashboardShell("marketplace", "Buy Products", "Browse fresh produce from verified farmers.", `
      <div class="filters">
        <input id="productSearch" type="search" placeholder="Search products" data-i18n-placeholder="lbl_search_ph">
        <select id="categoryFilter">
          <option value="All" data-i18n="opt_all">All Categories</option>
          <option value="Fruits" data-i18n="opt_fruits">Fruits</option>
          <option value="Vegetables" data-i18n="opt_veggies">Vegetables</option>
          <option value="Grains" data-i18n="opt_grains">Grains</option>
          <option value="Dairy" data-i18n="opt_dairy">Dairy</option>
        </select>
        <input id="minPriceFilter" type="number" min="0" placeholder="Min price" data-i18n-placeholder="ph_min_price">
        <input id="maxPriceFilter" type="number" min="0" placeholder="Max price" data-i18n-placeholder="ph_max_price">
        <select id="sortFilter">
          <option value="newest" data-i18n="opt_newest">Newest</option>
          <option value="oldest" data-i18n="opt_oldest">Oldest</option>
          <option value="price_asc" data-i18n="opt_price_asc">Price: Low to High</option>
          <option value="price_desc" data-i18n="opt_price_desc">Price: High to Low</option>
        </select>
      </div>
      <div class="products-grid" id="productsGrid">
        <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
      </div>
      <div class="pagination" id="productPagination">
        <button class="btn ghost" id="prevProducts" type="button" data-i18n="btn_prev">Previous</button>
        <span class="pill" id="productPageInfo"><span data-i18n="lbl_page">Page</span> 1</span>
        <button class="btn ghost" id="nextProducts" type="button" data-i18n="btn_next">Next</button>
      </div>
    `, "hdr_retailer_marketplace", "sub_retailer_marketplace", "nav_marketplace"));
  </script>
  <script src="../../js/app.js"></script>
</body>

</html>
